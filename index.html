<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BersihBersih Laundry — laundry modern dengan pickup & delivery, harga transparan, dan proses mudah."
    />
    <meta name="theme-color" content="#FAFAFA" />
    <link rel="icon" type="image/png" href="/src/webkecilstudio.png" />
    <link rel="apple-touch-icon" href="/src/webkecilstudio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Source+Code+Pro:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = localStorage.getItem("bb-theme") || "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      } catch (e) {}
    </script>
    <title>BersihBersih — Laundry jadi lebih ringan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
